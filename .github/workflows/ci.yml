name: Personal Finance Tracker CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/finance_tracker_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/finance_tracker_test
      JWT_SECRET_KEY: github-actions-test-secret
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v test_api.py

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    concurrency:
      group: production-deployment
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::355437693773:role/FinanceTrackerGitHubDeployRole
          aws-region: us-east-1

      - name: Deploy to EC2
        id: deployment
        run: |
          PARAMETERS=$(jq -n --arg sha "$GITHUB_SHA" '{
            commands: [
              ("runuser -u ec2-user -- bash -se -- " + $sha + " <<\u0027DEPLOY\u0027\n" +
              "cd /home/ec2-user/Personal-Finance-Tracker\n" +
              "git fetch origin main\n" +
              "git merge --ff-only \"$1\"\n" +
              "test \"$(git rev-parse HEAD)\" = \"$1\"\n" +
              "docker compose config --quiet\n" +
              "docker compose up -d --build --wait --wait-timeout 180\n" +
              "curl -fsS http://127.0.0.1:8003/health\n" +
              "DEPLOY")
            ],
            executionTimeout: ["600"]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0bb3420602fcee84d" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Personal Finance Tracker" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Verify deployment
        env:
          COMMAND_ID: ${{ steps.deployment.outputs.command_id }}
        run: |
          for attempt in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0bb3420602fcee84d" \
              --query "Status" \
              --output text) || STATUS="Pending"

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment successful!"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "i-0bb3420602fcee84d" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Pending|InProgress|Delayed)
                sleep 10
                ;;
              *)
                echo "Deployment failed: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "i-0bb3420602fcee84d" \
                  --query "StandardErrorContent" \
                  --output text
                exit 1
                ;;
            esac
          done

          echo "Deployment verification timed out"
          exit 1